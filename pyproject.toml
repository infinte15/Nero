[project]
name = "nero"
version = "0.1.0"
description = "Sprachschnittstelle zur Everything App"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Nur fuer den Datei-Upload an /listen - FastAPI verlangt es dafuer.
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# Nur fuer den Satelliten (Phase 4) und bewusst nicht in den Grunddependencies:
# das Brain-Image braucht weder onnxruntime noch PortAudio.
satellite = [
    "openwakeword>=0.6",
    "sounddevice>=0.4",
    "numpy>=1.24",
]
# Nur fuer den Geraete-Agent (Phase 5).
agent = [
    "websockets>=13",
    "pycaw>=20240210; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nero*"]

[tool.setuptools.package-data]
# Die Testseite gehoert ins Image, sonst laeuft "/" nur im Repo.
nero = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
